# Nethrion XP Machine
# 10 copper ingots from zero awards 1,395 raw XP in total, which reaches level 30.
# 2 copper ingots therefore award exactly 279 raw XP (an odd leftover ingot waits for its pair).
experience-per-copper-pair: 279

# Maximum time after a player inserts copper into the machine's hopper
# during which that deposit may be attributed to that player.
depositor-memory-seconds: 20
